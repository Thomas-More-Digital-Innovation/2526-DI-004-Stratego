basePath: /
definitions:
  models.BoardSetup:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_default:
        type: boolean
      name:
        type: string
      setup_data:
        description: JSON string of piece positions
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  models.ChangePasswordRequest:
    properties:
      confirm_password:
        type: string
      new_password:
        type: string
      old_password:
        type: string
    type: object
  models.CreateUserRequest:
    properties:
      password:
        type: string
      profile_picture:
        type: string
      username:
        type: string
    type: object
  models.Game:
    properties:
      created_at:
        type: string
      finished_at:
        type: string
      game_type:
        type: string
      id:
        type: string
      initial_state:
        type: string
      moves:
        items:
          $ref: '#/definitions/models.GameMove'
        type: array
      player1_user_id:
        type: integer
      player2_user_id:
        type: integer
      winner_id:
        type: integer
    type: object
  models.GameMove:
    properties:
      attacker_data:
        type: string
      created_at:
        type: string
      defender_data:
        type: string
      from_x:
        type: integer
      from_y:
        type: integer
      game_id:
        type: string
      id:
        type: integer
      move_index:
        type: integer
      player_id:
        type: integer
      result:
        type: string
      to_x:
        type: integer
      to_y:
        type: integer
    type: object
  models.GameSummaryDTO:
    properties:
      gameId:
        type: string
      gameType:
        type: string
      isGameOver:
        type: boolean
      isRunning:
        type: boolean
      isSetupPhase:
        type: boolean
      player1Username:
        type: string
      player2Username:
        type: string
      round:
        type: integer
    type: object
  models.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      id:
        type: integer
      profile_picture:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  models.UserStats:
    properties:
      avg_game_duration_seconds:
        type: number
      created_at:
        type: string
      draws:
        type: integer
      id:
        type: integer
      losses:
        type: integer
      total_games:
        type: integer
      total_moves:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
      wins:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: info@dotsem.be
    name: Sem Van Broekhoven
    url: https://github.com/Thomas-More-Digital-Innovation/2526-DI-004-GoStrategy
  description: This is the API server for the GoStrategy game.
  license:
    name: MIT
    url: https://opensource.org/license/mit/
  termsOfService: http://swagger.io/terms/
  title: GoStrategy API
  version: 0.1.1
paths:
  /csrf:
    get:
      description: Retrieve a CSRF token for subsequent state-changing requests
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get CSRF token
      tags:
      - auth
  /debug/stats:
    get:
      description: Retrieve runtime memory, goroutine, and session statistics (Internal
        use)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get debug statistics
      tags:
      - debug
  /game/{gameID}:
    get:
      description: Establish a WebSocket connection to an active game session
      parameters:
      - description: Game ID
        in: path
        name: gameID
        required: true
        type: string
      - description: Player index (0 or 1)
        in: query
        name: player
        type: string
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "400":
          description: Game ID required or invalid player index
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Game not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Connect to game via WebSocket
      tags:
      - games
  /games:
    get:
      description: Retrieve a list of all currently active game sessions
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.GameSummaryDTO'
            type: array
      summary: List active games
      tags:
      - games
    post:
      consumes:
      - application/json
      description: Initialize a new game session with specified type and players
      parameters:
      - description: Game creation parameters
        in: body
        name: request
        required: true
        schema:
          properties:
            ai1:
              type: string
            ai2:
              type: string
            gameId:
              type: string
            gameType:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Game created successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request body or parameters
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new game
      tags:
      - games
  /games/{id}:
    delete:
      description: Terminate the active game session immediately and prevent further
        reconnection
      parameters:
      - description: Game ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: Success message
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Active game session not found or user is not a participant
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete active game session
      tags:
      - games
  /games/{id}/history:
    get:
      description: Retrieve the move history and final state of a specific game
      parameters:
      - description: Game ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Game'
        "400":
          description: Game ID required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Game history not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get game history
      tags:
      - games
  /health:
    get:
      description: Check if the API server is up and running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
  /monitoring/games/count:
    get:
      description: Retrieve the total number of games played in the system
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get total games played count
      tags:
      - monitoring
  /monitoring/users/count:
    get:
      description: Retrieve the total number of registered users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get total user count
      tags:
      - monitoring
  /users/{id}:
    get:
      description: Retrieve information about a user by their ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Invalid or missing user ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get user by ID
      tags:
      - users
  /users/{id}/games:
    get:
      description: Retrieve a list of games played by a specific user (paged)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Failed to retrieve games
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List user games
      tags:
      - games
  /users/{id}/stats:
    get:
      description: Retrieve win/loss/draw statistics for a specific user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserStats'
        "404":
          description: Stats not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get user statistics
      tags:
      - stats
  /users/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and return user details with session cookies
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid username or password
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - auth
  /users/logout:
    post:
      description: Clear user session and delete refresh token
      produces:
      - application/json
      responses:
        "200":
          description: Logged out successfully
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User logout
      tags:
      - auth
  /users/me:
    get:
      description: Retrieve information about the currently logged-in user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get current user
      tags:
      - users
  /users/me/board-setups:
    get:
      description: Retrieve all saved board setups for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.BoardSetup'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List board setups
      tags:
      - board-setups
    post:
      consumes:
      - application/json
      description: Save a new board setup configuration
      parameters:
      - description: Board setup configuration
        in: body
        name: setup
        required: true
        schema:
          $ref: '#/definitions/models.BoardSetup'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.BoardSetup'
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create board setup
      tags:
      - board-setups
  /users/me/board-setups/{id}:
    delete:
      description: Delete a specific board setup configuration by ID
      parameters:
      - description: Board Setup ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete board setup
      tags:
      - board-setups
    get:
      description: Retrieve a specific board setup configuration by ID
      parameters:
      - description: Board Setup ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BoardSetup'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Board setup not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get board setup
      tags:
      - board-setups
    put:
      consumes:
      - application/json
      description: Update an existing board setup configuration by ID
      parameters:
      - description: Board Setup ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated board setup configuration
        in: body
        name: setup
        required: true
        schema:
          $ref: '#/definitions/models.BoardSetup'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BoardSetup'
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update board setup
      tags:
      - board-setups
  /users/me/games:
    get:
      description: Retrieve a list of games played by the currently logged-in user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to retrieve games
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List current user games
      tags:
      - games
  /users/me/password:
    post:
      consumes:
      - application/json
      description: Update the password for the currently logged-in user
      parameters:
      - description: Password update details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password updated successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request body or passwords don't match
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized or invalid current password
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to update password
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Change password
      tags:
      - users
  /users/me/reconnectable:
    get:
      description: Retrieve a game session in progress for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get current user's reconnectable game
      tags:
      - games
  /users/me/stats:
    get:
      description: Retrieve win/loss/draw statistics for the currently logged-in user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserStats'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Stats not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get current user statistics
      tags:
      - stats
  /users/refresh:
    post:
      description: Renew the access token using a valid refresh token from cookies
      produces:
      - application/json
      responses:
        "200":
          description: Token refreshed
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Refresh token missing or invalid
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - auth
  /users/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with username and password
      parameters:
      - description: User registration details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Invalid request body or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Username already exists
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to create user
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
swagger: "2.0"
