services:
  backend:
    container_name: gostrategy-backend
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - PORT=8080
      - DB_HOST=${DB_HOST}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-gostrategy}
      - DB_SSLMODE=disable
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      gostrategy:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    container_name: gostrategy-frontend
    environment:
      - VITE_API_BASE=${VITE_API_BASE}
      - VITE_WS_BASE=${VITE_WS_BASE}
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  gostrategy:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-gostrategy}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - gostrategy-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gostrategy-pg-data:
