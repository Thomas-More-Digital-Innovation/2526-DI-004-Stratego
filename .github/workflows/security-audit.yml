name: Security Audit

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: ["*"]
    paths:
      - "code/frontend/pnpm-lock.yaml"
      - "code/backend/go.mod"
      - "code/backend/go.sum"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches: ["*"]
    paths:
      - "code/frontend/pnpm-lock.yaml"
      - "code/backend/go.mod"
      - "code/backend/go.sum"
      - ".github/workflows/security-audit.yml"

permissions:
  contents: read
  issues: write

jobs:
  frontend-audit:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Run security audit
        working-directory: code/frontend
        run: pnpm audit --audit-level high

  backend-audit:
    name: Backend Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Run Go Vulnerability Check
        uses: golang/govulncheck-action@v1
        with:
          work-dir: code/backend

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [frontend-audit, backend-audit]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Set current date
        id: date
        run: echo "date=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
      - name: Create or Comment on GitHub Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "Security Audit Failure: Vulnerability Detected"
          ISSUE_BODY: |
            The scheduled security audit workflow failed. A dependency vulnerability may have been discovered in the frontend or backend.

            **Please review the run details:**
            - **Workflow Run Logs:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Date:** ${{ steps.date.outputs.date }}

            Please investigate and update the vulnerable dependencies immediately.
          COMMENT_BODY: |
            The scheduled security audit failed again.

            **Workflow Run Logs:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Date:** ${{ steps.date.outputs.date }}
        run: |
          set -eo pipefail

          issue_number=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --label "security" \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == env.ISSUE_TITLE) | .number' \
            | head -n 1)

          if [ -n "$issue_number" ]; then
            echo "existing open issue found: #$issue_number. commenting instead of creating a new issue."
            gh issue comment "$issue_number" \
              --repo "${{ github.repository }}" \
              --body "$COMMENT_BODY"
          else
            echo "no existing open issue found. creating a new issue."
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$ISSUE_TITLE" \
              --body "$ISSUE_BODY" \
              --label "security"
          fi
