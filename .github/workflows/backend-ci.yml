name: Backend CI

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths:
      - "code/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["*"]
    paths:
      - "code/backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.auto_commit.outputs.commit_hash }}
      changes_detected: ${{ steps.auto_commit.outputs.changes_detected }}
    strategy:
      matrix:
        go-version: ["1.25"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: code/backend/go.sum

      - name: Cache golangci-lint analysis results
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-cache-${{ hashFiles('code/backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golangci-cache-

      - name: Ensure dependencies
        working-directory: code/backend
        run: go mod download

      - name: Check formatting (gofmt)
        working-directory: code/backend
        run: gofmt -l -w -s .

      - name: Commit Changes
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: fix gofmt errors"

      - name: Cache golangci-lint binary
        id: cache-golangci-lint
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ matrix.go-version }}

      - name: Install golangci-lint
        if: steps.cache-golangci-lint.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        working-directory: code/backend
        run: |
          # The binary is installed to GOPATH/bin
          $(go env GOPATH)/bin/golangci-lint run --config=../../.golangci.yaml

      - name: Mark formatting commit as green
        if: steps.auto_commit.outputs.changes_detected == 'true'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ steps.auto_commit.outputs.commit_hash }} \
            -d '{"state":"success", "target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}", "description":"gofmt auto-formatting applied", "context":"Static Code Analysis"}'

  test:
    name: Build & Test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        go-version: ["1.25"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: gostrategy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: code/backend/go.sum

      - name: Ensure dependencies
        working-directory: code/backend
        run: go mod download

      - name: Create non-superuser for RLS tests
        # POSTGRES_USER is always a superuser which bypasses RLS even with FORCE.
        # We create a dedicated non-superuser so our policies are properly enforced.
        env:
          PGPASSWORD: password
        run: |
          psql -h localhost -U user -d gostrategy_test -c "
            CREATE USER appuser WITH NOSUPERUSER LOGIN PASSWORD 'apppass';
            GRANT ALL PRIVILEGES ON DATABASE gostrategy_test TO appuser;
            GRANT ALL ON SCHEMA public TO appuser;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO appuser;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO appuser;
          "

      - name: Cache gotestsum binary
        id: cache-gotestsum
        uses: actions/cache@v4
        with:
          path: ~/go/bin/gotestsum
          key: ${{ runner.os }}-gotestsum-${{ matrix.go-version }}

      - name: Install gotestsum
        if: steps.cache-gotestsum.outputs.cache-hit != 'true'
        run: go install gotest.tools/gotestsum@latest

      - name: Run tests with coverage
        working-directory: code/backend
        env:
          TEST_DB_DSN: "host=localhost user=appuser password=apppass
            dbname=gostrategy_test sslmode=disable"
        run: |
          # Run tests with gotestsum for a clear overview of failures in CI logs
          $(go env GOPATH)/bin/gotestsum --format pkgname-and-test-fails --junitfile unit-tests.xml -- -race ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: code/backend/coverage.out
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.out

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: code/backend/unit-tests.xml

      # --- Test & Coverage Analysis ---
      - name: check test coverage
        id: coverage
        uses: vladopajic/go-test-coverage@v2
        continue-on-error: true
        with:
          config: ./.github/.testcoverage.yml

      - name: Generate Detailed Coverage Report
        id: detailed_report
        if: always()
        run: |
          REPORT=$(./code/backend/scripts/coverage_report.sh code/backend/coverage.out)
          echo "table<<EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # --- Pull Request Interaction ---
      - name: find pull request ID
        id: find_pr
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
          EXISTING_PR: ${{ github.event.pull_request.number }}
        run: |
          PR_ID=$(./code/backend/scripts/find_pr.sh \
            "$REPO" \
            "$OWNER" \
            "$BRANCH" \
            "$GITHUB_TOKEN" \
            "$EXISTING_PR")

          if [ -n "$PR_ID" ]; then
            echo "pull_request_id=$PR_ID" >> $GITHUB_OUTPUT
          fi

      - name: post coverage report
        if: always() && steps.find_pr.outputs.pull_request_id
        uses: thollander/actions-comment-pull-request@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-tag: coverage-report
          pr-number: ${{ steps.find_pr.outputs.pull_request_id }}
          message: |
            ### Test Coverage Report

            ${{ steps.coverage.outputs.report && fromJSON(steps.coverage.outputs.report) || 'No coverage report available' }}

            <details>
            <summary>View Detailed Package Coverage</summary>

            ${{ steps.detailed_report.outputs.table }}

            </details>

      # --- Verification & Cleanup ---
      - name: "finally check coverage"
        if: always() && steps.coverage.outcome == 'failure'
        shell: bash
        run: |
          echo "### ❌ Coverage Check Failed" >> $GITHUB_STEP_SUMMARY
          echo "Test coverage does not meet the required thresholds. Check the PR comment for details." >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Final Status
        if: failure() && steps.coverage.outcome != 'failure'
        run: |
          echo "### ❌ CI Failed" >> $GITHUB_STEP_SUMMARY
          echo "Backend CI failed. Review the logs above to see test/lint failures." >> $GITHUB_STEP_SUMMARY

      - name: Post test status to formatting commit
        if: always() && needs.lint.outputs.changes_detected == 'true'
        run: |
          STATE="success"
          if [ "${{ job.status }}" = "failure" ] || [ "${{ job.status }}" = "cancelled" ] || [ "${{ steps.coverage.outcome }}" = "failure" ]; then
            STATE="failure"
          fi
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ needs.lint.outputs.commit_hash }} \
            -d "{\"state\":\"$STATE\", \"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"description\":\"Unit tests and coverage validation\", \"context\":\"Build & Test\"}"
