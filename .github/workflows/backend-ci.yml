name: Backend CI

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "*" ]
    paths:
      - "code/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ "*" ]
    paths:
      - "code/backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ "1.25" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules & build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            code/backend/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{
            hashFiles('code/backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
            ${{ runner.os }}-go-

      - name: Ensure dependencies
        working-directory: code/backend
        run: go mod download

      - name: Check formatting (gofmt)
        working-directory: code/backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'ed:";
            echo "$unformatted";
            echo "Run 'gofmt -w .' to fix formatting.";
            exit 1
          fi

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        working-directory: code/backend
        run: |
          # The binary is installed to GOPATH/bin
          $(go env GOPATH)/bin/golangci-lint run --config=../../.golangci.yaml

  test:
    name: Build & Test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        go-version: [ "1.25" ]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: gostrategy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules & build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            code/backend/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{
            hashFiles('code/backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
            ${{ runner.os }}-go-

      - name: Ensure dependencies
        working-directory: code/backend
        run: go mod download

      - name: Create non-superuser for RLS tests
        # POSTGRES_USER is always a superuser which bypasses RLS even with FORCE.
        # We create a dedicated non-superuser so our policies are properly enforced.
        env:
          PGPASSWORD: password
        run: |
          psql -h localhost -U user -d gostrategy_test -c "
            CREATE USER appuser WITH NOSUPERUSER LOGIN PASSWORD 'apppass';
            GRANT ALL PRIVILEGES ON DATABASE gostrategy_test TO appuser;
            GRANT ALL ON SCHEMA public TO appuser;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO appuser;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO appuser;
          "

      - name: Run tests with coverage
        working-directory: code/backend
        env:
          TEST_DB_DSN: "host=localhost user=appuser password=apppass
            dbname=gostrategy_test sslmode=disable"
        run: |
          # Install gotestsum for better failure overview
          go install gotest.tools/gotestsum@latest
          
          # Run tests with gotestsum for a clear overview of failures in CI logs
          $(go env GOPATH)/bin/gotestsum --format pkgname-and-test-fails --junitfile unit-tests.xml -- -race ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.out

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: code/backend/unit-tests.xml

      - name: check test coverage
        id: coverage
        uses: vladopajic/go-test-coverage@v2
        continue-on-error: true # Should fail after coverage comment is posted
        with:
          config: ./.github/.testcoverage.yml

      # Post coverage report as comment (in 2 steps)
      - name: find pull request ID
        if: always()
        run: |
            PR_DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:${{ github.ref_name }}&state=open")
            PR_ID=$(echo "$PR_DATA" | jq -r '.[0].number')
            
            if [ "$PR_ID" != "null" ] && [ "$PR_ID" != "" ]; then
              echo "pull_request_id=$PR_ID" >> $GITHUB_ENV
            else
              echo "No open pull request found for this branch."
            fi
      
      - name: post coverage report
        if: always() && env.pull_request_id
        uses: thollander/actions-comment-pull-request@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-tag: coverage-report
          pr-number: ${{ env.pull_request_id }}
          message: |
            go-test-coverage report:
            ```
            ${{ fromJSON(steps.coverage.outputs.report) }}
            ```

      - name: "finally check coverage"
        if: always() && steps.coverage.outcome == 'failure'
        shell: bash
        run: |
          echo "### ❌ Coverage Check Failed" >> $GITHUB_STEP_SUMMARY
          echo "Test coverage does not meet the required thresholds. Check the PR comment for details." >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Final Status
        if: failure() && steps.coverage.outcome != 'failure'
        run: |
          echo "### ❌ CI Failed" >> $GITHUB_STEP_SUMMARY
          echo "Backend CI failed. Review the logs above to see test/lint failures." >> $GITHUB_STEP_SUMMARY
